<title>Central de Controle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; cada aba é uma coluna de painéis de trabalho, densa e escaneável. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d5dcd8; --fg:#17201c; --muted:#5b6862;
  --accent:#1f5f4a; --accent-soft:#dcebe4; --accent-fg:#ffffff;
  --ok:#2c7a4b; --ok-soft:#dff1e5; --warn:#a1640a; --warn-soft:#fbeed6; --bad:#b23a2e; --bad-soft:#f8e1de;
  --deb:#7b3f8c; --deb-soft:#f1e4f4;
  --f-ui:"Familjen Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201d; --sunk:#1f2925; --line:#2d3934; --fg:#e6ece9; --muted:#97a69f;
  --accent:#6cc4a1; --accent-soft:#1d3a30; --accent-fg:#0d1512;
  --ok:#6fcf93; --ok-soft:#173326; --warn:#e8b25a; --warn-soft:#3a2c12; --bad:#f08a7e; --bad-soft:#3d1d19;
  --deb:#d49ae3; --deb-soft:#33213a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201d; --sunk:#1f2925; --line:#2d3934; --fg:#e6ece9; --muted:#97a69f;
  --accent:#6cc4a1; --accent-soft:#1d3a30; --accent-fg:#0d1512;
  --ok:#6fcf93; --ok-soft:#173326; --warn:#e8b25a; --warn-soft:#3a2c12; --bad:#f08a7e; --bad-soft:#3d1d19;
  --deb:#d49ae3; --deb-soft:#33213a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.today{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg.mode button[aria-pressed="true"]#mDeb{color:var(--deb)}
.seg.mode button[aria-pressed="true"]#mHum{color:var(--accent)}
.hello{border-left:4px solid var(--deb);padding-left:12px;margin-bottom:18px}
.hello.hum{border-left-color:var(--accent)}
.hello h2{color:var(--deb)} .hello.hum h2{color:var(--accent)}
.hello p{margin:0}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:9px 12px 10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav a.deb[aria-current="page"]{border-bottom-color:var(--deb)}
nav a.deb{color:var(--deb)}
main{padding-block:20px 60px}
.note{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:8px;margin-bottom:16px}
.note.err{color:var(--bad);border-color:var(--bad)}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);margin-top:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.deb{background:var(--deb-soft);color:var(--deb)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end;padding:12px;background:var(--sunk);border-radius:10px}
form.add .wide{grid-column:1/-1}
button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.debb{background:var(--deb);color:var(--surface);border-color:var(--deb)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;font-weight:500;font-size:13px}
button.ghost:hover{color:var(--fg)}
button.ghost.arm{color:var(--bad)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.proj{display:flex;flex-direction:column;gap:14px}
.proj .desc{color:var(--muted);margin:0;max-width:70ch}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.arch div{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13.5px;min-width:0}
.arch b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.arch ul{margin:0;padding-left:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.debhead{border-left:4px solid var(--deb);padding-left:12px;margin-bottom:18px}
.debhead h2{color:var(--deb)}
.recharge{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:10px;background:var(--deb-soft);border-radius:8px;margin-top:8px;align-items:end}
.inline-add{display:flex;gap:6px;flex-wrap:wrap}
.inline-add input{flex:1;min-width:140px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
.pixgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pix{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.qr{flex:none;width:112px;height:112px;background:#ffffff;border-radius:6px;padding:4px;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.pix .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pix code{font-family:var(--f-num);font-size:11px;color:var(--muted);overflow-wrap:anywhere;max-height:3.2em;overflow:hidden;user-select:all}
.pix .acts{display:flex;gap:6px;flex-wrap:wrap}
.pix .acts button{padding:6px 10px;font-size:13px}
.editcli{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:10px;background:var(--sunk);border-radius:8px;margin-top:8px;align-items:end}
.editcli textarea{grid-column:1/-1;min-height:70px;font-family:var(--f-num);font-size:12px}
details.camp{border-top:1px solid var(--line);padding-top:8px}
details.camp summary{cursor:pointer;font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
details.camp table{font-size:13px;margin-top:6px}
input[type="file"]{padding:6px;font-size:13px}
.agenda{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dia{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:8px;border:1px solid transparent;font-weight:500}
.dia span{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}.dia small{font-size:11px}
.dia.trabalho{background:var(--ok-soft);color:var(--ok)}.dia.feriado{background:var(--warn-soft);color:var(--warn)}.dia.folga{background:var(--sunk);color:var(--muted)}
.dia:disabled{cursor:default}
.leadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lead{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.lead.feito{background:var(--sunk)}
.lead .nm,.nm{font-size:16.5px;font-weight:600;overflow-wrap:anywhere}
.lead .tel{font-size:20px;user-select:all;letter-spacing:.01em}
.resbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.resbtns button{padding:11px 8px}
.etapas{display:flex;flex-direction:column;gap:4px}
.etapa{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--sunk);cursor:pointer;font-size:15px}
.etapa.ok span{text-decoration:line-through;color:var(--muted)}
.etapa.atual{background:var(--accent-soft);font-weight:600}
.btnlink{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none;font-size:14px}
.btnlink:hover{filter:brightness(1.08)}
.txtprev{margin:0;padding:10px 12px;background:var(--sunk);border-radius:8px;font-family:var(--f-num);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip small{font-weight:500;font-size:11px}
.chip.on{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Central de <span>Controle</span></div>
      <div class="topr"><span class="today" id="hojeTxt"></span>
        <div class="seg mode" role="group" aria-label="Quem está usando"><button data-mode="deborah" id="mDeb">Deborah</button><button data-mode="humberto" id="mHum">Humberto</button></div></div>
    </div>
    <nav id="nav" aria-label="Seções">
      <a href="#hoje" data-tab="hoje" data-m="deborah">Hoje</a>
      <a href="#tarefas" data-tab="tarefas" data-m="deborah">Pendências</a>
      <a href="#saldos" data-tab="saldos" data-m="deborah">Saldos</a>
      <a href="#resultados" data-tab="resultados" data-m="deborah">Resultados</a>
      <a href="#plumen" data-tab="plumen" data-m="deborah">Lumen ERP</a>
      <a href="#pagencia" data-tab="pagencia" data-m="deborah">Captação</a>
      <a href="#reunioes" data-tab="reunioes" data-m="deborah">Reuniões</a>
      <a href="#projetos" data-tab="projetos" data-m="deborah">Projetos</a>
      <a href="#financeiro" data-tab="financeiro" data-m="deborah">Operações externas</a>
      <a href="#humberto" data-tab="humberto" data-m="humberto">Minha área</a>
      <a href="#hleads" data-tab="hleads" data-m="humberto">Contatos</a>
      <a href="#hresultados" data-tab="hresultados" data-m="humberto">Resultados</a>
      <a href="#hprojetos" data-tab="hprojetos" data-m="humberto">Projetos</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="status" class="note">Carregando os dados do painel…</div>
  <section id="view"></section>
</main>

<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const COLS=["tarefas","reunioes","projetos","financeiro","clientes","saldos","campanhas","config","leads","vendas","resultados"];
let leadFiltro={projeto:"",status:"",q:""}, leadsAba="agencia";
let imp=null; const openCamp=new Set();
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.camp){d.open?openCamp.add(d.dataset.camp):openCamp.delete(d.dataset.camp)}},true);
const S={}; COLS.forEach(c=>S[c]=[]);
let db=null, tab="hoje", tarefaFiltro="todos", armed=null, openRecharge=null, openEdit=null, mode="deborah";
const HUM_TABS=["humberto","hleads","hresultados","hprojetos"];
try{ if(localStorage.getItem("qg-mode")==="humberto") mode="humberto"; }catch(e){}
function saudacao(){const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const addMonth=s=>{const d=new Date(s+"T12:00:00");const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const br=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"/"+m};
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
const dia=s=>DIAS[new Date(s+"T12:00:00").getDay()];
function prazoPill(p,feito){
  if(!p||feito)return"";
  const h=hoje();
  if(p<h)return`<span class="pill bad">atrasado · ${br(p)}</span>`;
  if(p===h)return`<span class="pill warn">hoje</span>`;
  if(p===addDays(h,1))return`<span class="pill acc">amanhã</span>`;
  return`<span class="pill">${dia(p)} ${br(p)}</span>`;
}
function setStatus(msg,err){const el=$("#status");if(!msg){el.hidden=true;return}el.hidden=false;el.textContent=msg;el.classList.toggle("err",!!err)}

/* ---------- escrita ---------- */
async function salvar(col,id,data){
  if(!db){setStatus("Sem conexão com o banco do painel. Abra o painel logado na conta.",true);return}
  try{ if(id) await db.collection(col).doc(id).update(data); else await db.collection(col).add(data); }
  catch(e){ setStatus("Não deu pra salvar: "+(e&&e.message||"erro")+". Tente de novo.",true); }
}
async function apagar(col,id){ try{await db.collection(col).doc(id).delete()}catch(e){setStatus("Não deu pra apagar. Tente de novo.",true)} }
function delBtn(col,id){if(mode==="humberto")return"";const k=col+"/"+id;return`<button class="ghost ${armed===k?"arm":""}" data-del="${k}">${armed===k?"Confirmar exclusão":"Excluir"}</button>`}

/* ---------- views ---------- */
function vTarefaRow(t){
  const d=t.status==="feita";
  const quem=t.responsavel==="Deborah"?`<span class="pill deb">Deborah</span>`:`<span class="pill">Humberto</span>`;
  const proj=t.projeto?`<span>${esc(t.projeto)}</span>`:"";
  if(mode==="humberto")return`<div class="row ${d?"done":""}"><input type="checkbox" id="tk-${esc(t.id)}" data-toggle="${esc(t.id)}" ${d?"checked":""} aria-label="Concluir ${esc(t.titulo)}"><div class="main"><label class="t" for="tk-${esc(t.id)}">${esc(t.titulo)}</label><div class="meta">${d?'<span class="pill ok">concluída</span>':(prazoPill(t.prazo,d)||(t.prazo?br(t.prazo):"sem prazo"))}${proj}</div></div></div>`;
  return`<div class="row ${d?"done":""}"><input type="checkbox" id="tk-${esc(t.id)}" data-toggle="${esc(t.id)}" ${d?"checked":""} aria-label="Concluir">
  <div class="main"><label class="t" for="tk-${esc(t.id)}">${esc(t.titulo)}</label><div class="meta">${quem}${prazoPill(t.prazo,d)}${proj}</div></div>${delBtn("tarefas",t.id)}</div>`;
}
function ordTarefas(a){return a.slice().sort((x,y)=>(x.status==="feita")-(y.status==="feita")||String(x.prazo||"9999").localeCompare(String(y.prazo||"9999")))}
function vReuniaoRow(r){
  return`<div class="row"><div class="main"><div class="t">${esc(r.titulo)}</div><div class="meta">
  <span class="num">${dia(r.data)} ${br(r.data)}${r.hora?" · "+esc(r.hora):""}</span>${r.com?`<span>com ${esc(r.com)}</span>`:""}${r.local?`<span>${esc(r.local)}</span>`:""}${r.data===hoje()?'<span class="pill warn">hoje</span>':""}</div>
  ${r.notas?`<div class="meta">${esc(r.notas)}</div>`:""}</div>${delBtn("reunioes",r.id)}</div>`;
}
const temSaldo=c=>c.saldoAtual!==undefined&&c.saldoAtual!==null&&c.saldoAtual!=="";
const limite=c=>c.alertaAbaixo?+c.alertaAbaixo:(c.valorRecarga?Math.round(c.valorRecarga*0.3):0);
function nivel(c){
  if(!temSaldo(c))return"sem";
  if(+c.saldoAtual<=0)return"zerado";
  if(limite(c)&&+c.saldoAtual<=limite(c))return"acabando";
  return"ok";
}
const NIVEL_ORD={zerado:0,acabando:1,sem:2,ok:3};
/* agenda: trabalho / feriado / folga */
const TIPO={trabalho:{t:"Dia de trabalho",c:"ok"},feriado:{t:"Feriado · sem prospecção",c:"warn"},folga:{t:"Folga · sem alertas",c:""}};
const agenda=()=>((S.config.find(x=>x.id==="agenda")||{}).dias)||{};
const tipoPadrao=d=>{const w=new Date(d+"T12:00:00").getDay();return(w===0||w===6)?"folga":"trabalho"};
const tipoDia=d=>agenda()[d]||tipoPadrao(d);
const ehProsp=d=>tipoDia(d)==="trabalho";
const proxProsp=d=>{let x=d;for(let i=0;i<60&&!ehProsp(x);i++)x=addDays(x,1);return x};
const proxUtil=d=>proxProsp(addDays(d,1));

function proxRecarga(c){const ds=(c.recargaDias||[]).map(Number);if(!ds.length)return"";
  let x=c.ultimaRecarga?addDays(c.ultimaRecarga,1):hoje();
  for(let i=0;i<14;i++){if(ds.includes(new Date(x+"T12:00:00").getDay()))return pulaRecarga(x);x=addDays(x,1)}return""}
const recargaDevida=c=>{const p=proxRecarga(c);return!!p&&p<=hoje()};
const precisa=c=>["zerado","acabando"].includes(nivel(c))||recargaDevida(c)||!!agRecHoje(c)||!!pedido(c);
function saldoStatus(c){

  return`<span class="pill ok">ok</span>`;

function saldoAtualTxt(c){return c.saldoAtual!==undefined&&c.saldoAtual!==null&&c.saldoAtual!==""?`<span class="num">${brl(c.saldoAtual)}</span><div class="meta">atualizado ${quando(c.saldoAtualizadoEm)}</div>`:'<span class="meta">não informado</span>'}

const SLOT_NOME={unico:"",manha:"Manhã",tarde:"Tarde",noite:"Noite"};

const pixDe=(c,s)=>(c.pix&&c.pix[s]&&c.pix[s].codigo)?c.pix[s]:null;
const pixAgora=(c,s)=>{const p=pixDe(c,s);return p&&(p.paraDia||"")<=hoje()?p:null};
const pixesProntos=c=>slots(c).filter(s=>pixAgora(c,s));
const agRec=c=>c.recargaAgendada&&c.recargaAgendada.data?c.recargaAgendada:null;

const achar=k=>{const[id,s]=k.split("|");const c=S.clientes.find(x=>x.id===id);return c?{c,s,p:pixDe(c,s)}:null};
function pixCard(c,s){

  return`<div class="pix"><div class="qr" data-qr="${esc(k)}" aria-label="QR Code Pix de ${esc(c.nome)}"></div>

      <code>${esc(p.codigo)}</code>

}
function fillQRs(){document.querySelectorAll("[data-qr]").forEach(el=>{const a=achar(el.dataset.qr);const q=a&&a.p&&makeQR(a.p.codigo);el.innerHTML=q?q.createSvgTag({cellSize:4,margin:0,scalable:true}):'<span class="meta" style="color:#555">QR indisponível</span>'})}
async function baixarQR(c,s){
  const p=pixDe(c,s); const q=p&&makeQR(p.codigo);if(!q){toast("Não consegui gerar o QR. Use o Copiar Pix.");return}
  const n=q.getModuleCount(),cell=Math.floor(520/n),size=n*cell,W=size+80,H=size+170;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  g.fillStyle="#ffffff";g.fillRect(0,0,W,H);g.fillStyle="#000000";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(40+k*cell,40+r*cell,cell,cell);
  g.textAlign="center";g.font="600 28px sans-serif";g.fillText(c.nome+(SLOT_NOME[s]?" ("+SLOT_NOME[s]+")":"")+(valorPix(c,p)?" · "+brl(valorPix(c,p)):""),W/2,size+95);
  g.font="20px sans-serif";g.fillStyle="#444444";g.fillText("Pix para saldo de anúncios (Meta) · gerado "+br(p.geradoEm),W/2,size+135);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(!dl){toast("Download indisponível aqui. Use o Copiar Pix.");return}
  try{await dl.save({filename:"pix-"+c.id+(s!=="unico"?"-"+s:"")+".png",data:blob});toast("QR salvo")}catch(e){if(e&&e.code!=="declined")toast("Não deu pra salvar o QR.")}
}

const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function parseCSV(t){
  t=t.replace(/^﻿/,"");const first=t.split(/\r?\n/)[0]||"";const d=first.split(";").length>first.split(",").length?";":(first.split("\t").length>first.split(",").length?"\t":",");
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===d){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function num(s){s=String(s??"").replace(/[^\d,.\-]/g,"");if(!s)return 0;
  if(s.includes(",")&&s.includes(".")){s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(s.includes(","))s=s.replace(",",".");return parseFloat(s)||0}
const COLMAP={conta:["nome da conta","account name"],nome:["nome da campanha","campaign name"],status:["veiculacao da campanha","campaign delivery","veiculacao"],
  gasto:["valor usado","amount spent"],resultados:["resultados","results"],indicador:["indicador de resultado","result indicator"],cpr:["custo por resultado","cost per result"],
  impressoes:["impressoes","impressions"],ini:["inicio dos relatorios","reporting starts"],fim:["termino dos relatorios","reporting ends"]};
function lerRelatorio(texto){
  const rows=parseCSV(texto);if(rows.length<2)throw new Error("arquivo vazio");
  const h=rows[0].map(norm);const ix={};
  for(const k in COLMAP){ix[k]=h.findIndex(x=>COLMAP[k].some(c=>x.startsWith(c)))}
  if(ix.nome<0||ix.gasto<0)throw new Error("não achei as colunas de campanha e valor usado");
  const out={};
  rows.slice(1).forEach(r=>{const nome=(r[ix.nome]||"").trim();if(!nome)return;
    const conta=ix.conta>=0?(r[ix.conta]||"").trim():"(conta do relatório)";
    const o=out[conta]||(out[conta]={campanhas:[],ini:"",fim:""});
    if(ix.ini>=0&&r[ix.ini])o.ini=o.ini&&o.ini<r[ix.ini]?o.ini:r[ix.ini].trim();
    if(ix.fim>=0&&r[ix.fim])o.fim=o.fim&&o.fim>r[ix.fim]?o.fim:r[ix.fim].trim();
    o.campanhas.push({conta,nome,status:ix.status>=0?(r[ix.status]||"").trim():"",gasto:num(r[ix.gasto]),resultados:ix.resultados>=0?num(r[ix.resultados]):0,
      indicador:ix.indicador>=0?(r[ix.indicador]||"").replace(/^actions:/,"").trim():"",cpr:ix.cpr>=0?num(r[ix.cpr]):0,impressoes:ix.impressoes>=0?num(r[ix.impressoes]):0});
  });
  return out;
}

let pendImp=null;
function titulo(s){const small=new Set(["de","da","do","das","dos","e"]);return String(s||"").toLowerCase().split(/\s+/).filter(Boolean).map(w=>small.has(w)?w:w[0].toUpperCase()+w.slice(1)).join(" ")}
function foneFmt(t){const d=telLimpo(t);if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return String(t||"").trim()}
function cnaeRotulo(k,cod,desc){cod=String(cod||"").replace(/\D/g,"");if(!cod)return"";
  const achado=rodizio(k).find(x=>x.split("·")[0].replace(/\D/g,"")===cod);if(achado)return achado;
  return cod.length===7?`${cod.slice(0,4)}-${cod[4]}/${cod.slice(5)} · ${desc||""}`.trim():`${cod} · ${desc||""}`}
function lerPesquisa(k,linhas){
  const P=PROSP[k], ign={"já na base":0,"sem telefone":0,"não é MEI":0,"inativa":0}, rows=[];
  const jaTel=new Set(S.leads.filter(x=>x.projeto===P.proj).map(x=>telLimpo(x.telefone)).filter(Boolean));
  const jaCnpj=new Set(S.leads.filter(x=>x.projeto===P.proj&&x.cnpj).map(x=>x.cnpj));
  linhas.forEach(r0=>{const r={};for(const key in r0)r[norm(key).replace(/\s+/g,"_")]=r0[key];
    const sit=norm(r.situacao_cadastral);if(sit&&sit!=="ativa"){ign["inativa"]++;return}
    const mei=r.mei_optante;const ehMei=mei===true||norm(mei)==="true"||norm(mei)==="sim";
    if(k==="lumen"&&mei!==undefined&&!ehMei){ign["não é MEI"]++;return}
    const tel=foneFmt(r.telefone||String(r.telefones||"").split(/[;,]/)[0]);if(!telLimpo(tel)){ign["sem telefone"]++;return}
    const cnpj=String(r.cnpj||"").replace(/\D/g,"").padStart(14,"0");
    if(jaTel.has(telLimpo(tel))||(r.cnpj&&jaCnpj.has(cnpj))){ign["já na base"]++;return}
    jaTel.add(telLimpo(tel));if(r.cnpj)jaCnpj.add(cnpj);
    const fant=String(r.nome_fantasia||"").trim(), raz=String(r.razao_social||r.nome||"").replace(/^[\d.\s]+/,"").trim();
    rows.push({nome:titulo(fant||raz)||"Sem nome",telefone:tel,cidade:titulo(r.municipio||r.cidade),bairro:titulo(r.bairro),cnpj:r.cnpj?cnpj:"",email:String(r.email||"").toLowerCase().trim(),
      cnae:cnaeRotulo(k,r.atividade_principal_codigo,r.atividade_principal_descricao)||v_cnaeAtual(k),porte:ehMei?"MEI":String(r.porte_empresa||"")});
  });
  return{k,rows,ign};
}

function alertasResultado(c){
  const hs=histDe(c.id),u=hs[hs.length-1],a=hs[hs.length-2],out=[];if(!u)return out;

  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block;overflow:visible"><polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="${xy.map(p=>p.join(",")).join(" ")}"/><circle cx="${xy[xy.length-1][0]}" cy="${xy[xy.length-1][1]}" r="2.6" fill="var(--accent)"/></svg>`;

  if(b.dataset.valores){const id=b.dataset.valores;const vr=document.getElementById("vr-"+id).value,al=document.getElementById("al-"+id).value;
    const rd=+document.getElementById("rd-"+id).value===3?3:1;
    const rdias=[0,1,2,3,4,5,6].filter(w=>{const el=document.getElementById("rw-"+id+"-"+w);return el&&el.checked});
    let link=((document.getElementById("lk-"+id)||{}).value||"").trim();
    if(link&&!/^https:\/\/([a-z0-9-]+\.)*facebook\.com\//i.test(link)){toast("O link precisa ser do Facebook (facebook.com).");return}
    link=link.replace(/([?&])session_id=[^&]*&?/,"$1").replace(/[?&]$/,"");
    await salvar("clientes",id,{valorRecarga:parseFloat(vr)||0,alertaAbaixo:parseFloat(al)||0,recargasDia:rd,recargaDias:rdias,linkSaldo:link});toast("Valores salvos");return}
  if(b.dataset.clearpix){const[id,s]=b.dataset.clearpix.split("|");const c=S.clientes.find(x=>x.id===id);const up={pix:{[s]:{codigo:"",geradoEm:""}}};
    if(c&&recargaDevida(c))up.ultimaRecarga=hoje();await salvar("clientes",id,up);return}
  if(b.dataset.pede){const c=S.clientes.find(x=>x.id===b.dataset.pede);if(!c)return;const on=!pedido(c);
    await salvar("clientes",c.id,{pedidoSaldo:{em:on?Date.now():0}});toast(on?"Avisado: falta saldo em "+c.nome:"Pedido retirado");return}
  if(b.dataset.pedok){await salvar("clientes",b.dataset.pedok,{pedidoSaldo:{em:0}});toast("Pedido atendido");return}
  if(b.dataset.cancagr){await salvar("clientes",b.dataset.cancagr,{recargaAgendada:{data:"",valor:0}});toast("Agendamento cancelado");return}
  if(b.dataset.recok){await salvar("clientes",b.dataset.recok,{ultimaRecarga:hoje()});toast("Recarga registrada");return}
  if(b.dataset.agenda){const d=b.dataset.agenda,ordem=["trabalho","feriado","folga"],atual=tipoDia(d),novo=ordem[(ordem.indexOf(atual)+1)%3];
    const dias={...agenda()};if(novo===tipoPadrao(d))delete dias[d];else dias[d]=novo;
    try{await db.collection("config").doc("agenda").set({dias});toast(dataCurta(d)+": "+TIPO[novo].t)}catch(e){setStatus("Não deu pra salvar a agenda.",true)}return}
  if(b.dataset.rec){openEdit=null;openRecharge=openRecharge===b.dataset.rec?null:b.dataset.rec;render();return}
  if(b.dataset.toggle){const t=S.tarefas.find(x=>x.id===b.dataset.toggle);if(t)await salvar("tarefas",t.id,{status:t.status==="feita"?"aberta":"feita",feitaEm:t.status==="feita"?null:Date.now()});return}
  if(b.dataset.etapa){const[pid,i]=b.dataset.etapa.split("|");const p=S.projetos.find(x=>x.id===pid);if(!p)return;const et=(p.etapas||[]).map((x,j)=>j==+i?{...x,feita:!x.feita}:x);await salvar("projetos",pid,{etapas:et});return}
  if(b.dataset.pago){const f=S.financeiro.find(x=>x.id===b.dataset.pago);if(!f)return;
    if(f.recorrente)await salvar("financeiro",f.id,{venc:addMonth(f.venc),ultimoPagamento:hoje()});
    else await salvar("financeiro",f.id,{status:"pago",pagoEm:hoje()});return}
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target; const v=id=>(document.getElementById(id)||{}).value||"";
  if(f.id==="fTarefa"){await salvar("tarefas",null,{titulo:v("tTitulo").trim(),responsavel:v("tResp"),prazo:v("tPrazo"),projeto:v("tProj"),status:"aberta",criadoEm:Date.now()});f.reset()}
  else if(f.id==="fDebTarefa"){await salvar("tarefas",null,{titulo:v("dTitulo").trim(),responsavel:v("dResp")||"Deborah",prazo:v("dPrazo"),projeto:"",status:"aberta",criadoEm:Date.now()});f.reset()}
  else if(f.id==="fHumDitar"){await salvar("tarefas",null,{titulo:v("hTitulo").trim(),responsavel:v("hResp")||"Deborah",prazo:v("hPrazo"),projeto:"",status:"aberta",criadoEm:Date.now(),ditadoPor:"Humberto"});f.reset()}
  else if(f.id==="fReuniao"){await salvar("reunioes",null,{titulo:v("rTitulo").trim(),com:v("rCom"),data:v("rData"),hora:v("rHora"),local:v("rLocal"),notas:v("rNotas"),criadoEm:Date.now()});f.reset()}
  else if(f.id==="fProjeto"){await salvar("projetos",null,{nome:v("pNome").trim(),status:v("pStatus"),descricao:v("pDesc"),etapas:[],arquitetura:[],ordem:50});f.reset()}
  else if(f.id==="fFin"){await salvar("financeiro",null,{tipo:v("fTipo"),descricao:v("fDesc").trim(),cliente:v("fCli"),valor:parseFloat(v("fValor"))||0,venc:v("fVenc"),recorrente:document.getElementById("fRec").checked,status:"aberto",criadoEm:Date.now()});f.reset()}
  else if(f.dataset.addetapa){const pid=f.dataset.addetapa;const nome=v("ne-"+pid).trim();if(!nome)return;const p=S.projetos.find(x=>x.id===pid);await salvar("projetos",pid,{etapas:[...(p.etapas||[]),{nome,feita:false}]});f.reset()}
  else if(f.id==="fVenda"){const dado={data:v("vData")||hoje(),cliente:v("vCli").trim(),projeto:v("vProj"),valor:parseFloat(v("vValor"))||0,descricao:v("vDesc").trim(),criadoEm:Date.now()};
    f.reset();document.getElementById("vData").value=hoje();await salvar("vendas",null,dado);toast("Venda registrada")}
  else if(f.dataset.rodform){const k=f.dataset.rodform;const lista=v("rod-"+k).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    try{await db.collection("config").doc(PROSP[k].cfg).set({lista});toast("Sugestões salvas")}catch(e){setStatus("Não deu pra salvar as sugestões.",true)}}
  else if(f.dataset.leadform){const k=f.dataset.leadform,P=PROSP[k];
    const proj=P.proj,cnae=v("lc-"+k).trim(),lib=document.getElementById("ll-"+k).checked,canal=P.canais?v("lk-"+k):"ligacao";
    const linhas=v("lt-"+k).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const paraDia=proxProsp(v("pd-"+k)||hoje());
    const tels=new Set(S.leads.filter(x=>x.projeto===proj).map(x=>telLimpo(x.telefone)).filter(Boolean));let n=0,dup=0;
    document.getElementById("lt-"+k).value="";
    for(const ln of linhas){const p=ln.split(/\s*[;\t|]\s*/);const nome=(p[0]||"").trim();if(!nome)continue;
      const tel=(p[1]||"").trim();if(tel&&tels.has(telLimpo(tel))){dup++;continue}tels.add(telLimpo(tel));
      await salvar("leads",null,{nome,telefone:tel,cidade:(p[2]||"").trim(),cnae,projeto:proj,canal,paraDia,porte:k==="lumen"?"MEI":"",status:lib?"liberado":"separado",historico:[],proximoContato:"",criadoEm:Date.now(),liberadoEm:lib?Date.now():null});n++}
    toast(n+" contato"+(n===1?"":"s")+" adicionado"+(n===1?"":"s")+(dup?" · "+dup+" repetido"+(dup===1?"":"s")+" ignorado"+(dup===1?"":"s"):""))}
  else if(f.dataset.saldoform){const id=f.dataset.saldoform;const val=v("sa-"+id);if(val==="")return;f.reset();
    await salvar("clientes",id,{saldoAtual:parseFloat(val)||0,saldoAtualizadoEm:Date.now()});toast("Saldo atualizado")}
  else if(f.dataset.pixform){const[id,s]=f.dataset.pixform.split("|");const code=v("px-"+id+"-"+s).replace(/[\r\n\t]+/g,"").trim();
    const quando=v("pq-"+id+"-"+s)||hoje(), valor=parseFloat(v("pv-"+id+"-"+s))||0;
    if(!code){if(quando<=hoje()){toast("Cole o Pix pra hoje, ou escolha o próximo dia útil pra só agendar.");return}
      f.reset();await salvar("clientes",id,{recargaAgendada:{data:quando,valor}});toast("Recarga agendada pra "+dataCurta(quando));return}
    if(!code.startsWith("000201")){toast("Esse código não parece um Pix copia e cola. Confira e cole de novo.");return}
    f.reset();await salvar("clientes",id,{pix:{[s]:{codigo:code,geradoEm:hoje(),paraDia:quando>hoje()?quando:"",valor}},recargaAgendada:{data:"",valor:0},pedidoSaldo:{em:0}});
    toast(quando>hoje()?"Pix salvo. O Humberto vê em "+dataCurta(quando)+".":"Pix salvo. O Humberto já vê na área dele.")}
  else if(f.dataset.editform){const id=f.dataset.editform;const c=S.clientes.find(x=>x.id===id);if(!c)return;
    const up={ciclo:Math.max(1,parseInt(v("ec-"+id))||1),pixValor:parseFloat(v("ev-"+id))||0};
    const code=v("ep-"+id).replace(/[\r\n\t]+/g,"").trim();
    if(code&&!code.startsWith("000201")){toast("Esse código não parece um Pix copia e cola. Confira e cole de novo.");return}
    if(code!==(c.pixCodigo||"")){up.pixCodigo=code;up.pixGeradoEm=code?hoje():""}
    const sv=v("es-"+id);if(sv!==""){up.saldoAtual=parseFloat(sv)||0;up.saldoAtualizadoEm=Date.now()}
    await salvar("clientes",id,up);openEdit=null;render();toast("Cliente atualizado")}
  else if(f.dataset.recform){const id=f.dataset.recform;const c=S.clientes.find(x=>x.id===id);if(!c)return;
    const valor=parseFloat(v("rv-"+id))||0,data=v("rd-"+id)||hoje(),prox=v("rp-"+id),prev=parseFloat(v("rx-"+id))||0;
    await salvar("saldos",null,{clienteId:id,cliente:c.nome,valor,data,obs:v("ro-"+id),por:"Deborah",criadoEm:Date.now()});
    await salvar("clientes",id,{ultimaData:data,ultimoValor:valor,proxima:prox,valorPrevisto:prev});
    openRecharge=null;render()}
});
window.addEventListener("hashchange",route);

$("#hojeTxt").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
route();
(async()=>{
  if(!window.claude||!window.claude.use){setStatus("Abra este painel pelo Claude, logado na conta, para ver e salvar os dados.",true);return}
  db=await window.claude.use("db");
  if(!db){setStatus("O banco do painel não está disponível nesta visualização. Abra logado na conta.",true);return}
  let pend=new Set(COLS);
  const timer=setTimeout(()=>{if(pend.size)setStatus("Os dados estão demorando pra chegar. Confira a conexão; o painel atualiza sozinho.",true)},10000);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(!snap.metadata.fromCache){pend.delete(c);if(!pend.size){clearTimeout(timer);setStatus("")}}
      render();
    },err=>{pend.delete(c);clearTimeout(timer);setStatus("Não deu pra carregar "+c+": "+(err&&err.message||"erro"),true)});
  });
})();
})();
